<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AudioHub</title>
    <style>
      html,
      body {
        /* Disables double-tap zoom and pinch gestures */
        touch-action: manipulation;

        /* If you want to disable all default touch behaviors completely, use 'none' instead */
        /* touch-action: none; */

        /* Prevent accidental text selection or rubber-band scrolling if needed */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;

        /* Lock dimensions */
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <script type="text/javascript">
      // Prevent pinch-to-zoom gestures on iOS Safari
      document.addEventListener(
        'gesturestart',
        function (e) {
          e.preventDefault()
        },
        { passive: false }
      )

      document.addEventListener(
        'gesturechange',
        function (e) {
          e.preventDefault()
        },
        { passive: false }
      )

      document.addEventListener(
        'gestureend',
        function (e) {
          e.preventDefault()
        },
        { passive: false }
      )

      // Prevent multi-touch drag/pinch zooming where applicable
      let lastTouchEnd = 0
      document.addEventListener(
        'touchend',
        function (e) {
          const now = new Date().getTime()
          if (now - lastTouchEnd <= 300) {
            e.preventDefault() // Prevents double-tap zoom
          }
          lastTouchEnd = now
        },
        { passive: false }
      )
    </script>
  </body>
</html>
