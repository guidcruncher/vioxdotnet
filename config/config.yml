zeroconf_enabled: true # Whether to keep the device discoverable at all times, even if authenticated via other means
zeroconf_port: 0       # The port to use for Zeroconf, 0 for random
zeroconf_backend: builtin
credentials:
  type: zeroconf
  spotify_token:
    access_token: '[ACCESS_TOKEN]'
    username: '[USERNAME]'
  zeroconf:
    persist_credentials: true # Whether to persist zeroconf user credentials even after disconnecting

server:
  enabled: true
  address: 127.0.0.1 # Which address to bind to
  port: 3678 # The server port
  allow_origin: '' # Value for the Access-Control-Allow-Origin header
  cert_file: '' # Path to certificate file for TLS
  key_file: '' # Path to key file for TLS
  image_size: 'default' # Album art image size (default, small, large, xlarge)

normalisation_disabled: false # Whether to disable normalization (default: false)
normalisation_use_album_gain: false # Whether to use album gain instead of track gain (default: false)
normalisation_pregain: 0 # Pregain in dB to apply before normalization (default: 0)

log_level: info # Log level configuration (trace, debug, info, warn, error)
log_disable_timestamp: false # Whether to disable timestamps in log output

device_id: '' # Spotify device ID (auto-generated)
device_name: "VIOX-NET" # Spotify device name
device_type: speaker # Spotify device type (icon)

# --- Updated Audio Output Section ---
audio_backend: alsa # Switched from 'pipe' to 'alsa' to utilize the ALSA equalizer chain
audio_device: plugequal # Routes output through pcm.plugequal -> snap_fifo -> /tmp/snapfifo
mixer_device: '' # Disabled ALSA hardware mixer synchronization
mixer_control_name: '' # Left empty since volume is handled externally/virtually
audio_buffer_time: 100000 # Reduced buffer time (microseconds) for lower latency (~100ms)
audio_period_count: 4 # Number of period chunks requested from ALSA
audio_output_pipe: '' # Unused when audio_backend is 'alsa'
audio_output_pipe_format: s16le # Unused when audio_backend is 'alsa'
audio_output_pipe_wait_for_reader: false # Unused when audio_backend is 'alsa'
# ------------------------------------

bitrate: 320 # Playback bitrate (96, 160, 320)
volume_steps: 100 # Volume steps count
initial_volume: 100 # Initial volume in steps (not applied to the mixer device)
ignore_last_volume: false # Whether to ignore the last saved volume and always use initial_volume
external_volume: true # Whether volume is controlled externally 
disable_autoplay: true # Whether autoplay of more songs should be disabled
