# High-quality ALSA path:
# apps -> plug (convert once) -> equal -> dmix (S32 mix) -> hw
#
# Requires: alsa-plugins (speexrate / samplerate) and alsaequal
# Tune EQ with: alsamixer -D equal

defaults.pcm.rate_converter "speexrate_best"
# Fallback if speexrate is missing:
# defaults.pcm.rate_converter "samplerate_best"

pcm.!default {
    type plug
    slave.pcm "plugequal"
}

ctl.equal {
    controls "/data/alsaequal.bin"
    type equal
}

pcm.plugequal {
    type equal
    slave.pcm "dmixer"
    controls "/data/alsaequal.bin"
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_key_add_uid true
    slave {
        pcm "hw:0,0"          # change card if needed (aplay -l)
        format S32_LE         # mix at 24-bit precision (dmix uses 24 of 32)
        rate 48000            # use card native rate if different (44100 / 96000)
        channels 2
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
    }
}

ctl.!default {
    type hw
    card 0
}
