[server]
user = root
group = root
datadir = /data/snapserver

# Internal server buffer before distributing to clients (reduced from 1000ms for lower latency)
buffer = 400

[http]
enabled = true
bind_to_address = 127.0.0.1
port = 1780
ssl_enabled = false

# Modern Control Server configuration (fixes 'tcp.enabled' deprecation)
[tcp-control]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

# Modern Audio Streaming TCP Server configuration (fixes 'stream.port' deprecation)
[tcp-streaming]
bind_to_address = 0.0.0.0
port = 1704

[stream]
# Updated pipe path to /tmp/snapfifo (from ALSA file plugin) and chunk_ms to 10 for low-latency delivery
source = pipe:///tmp/snapfifo?name=${DEVICE_NAME}&mode=read&sampleformat=44100:16:2&chunk_ms=10

sampleformat = 44100:16:2
codec = flac
chunk_ms = 10
send_to_muted = false

[streaming_client]

[logging]
sink = stdout
