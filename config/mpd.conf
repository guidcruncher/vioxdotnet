# Files and directories
music_directory                 "/music/cache"
playlist_directory              "/data//playlists"
db_file                         "/data/tag_cache"
pid_file                        "/run/mpd/pid"
state_file                      "/var/lib/mpd/state"
sticker_file                    "/var/lib/mpd/sticker.sql"
auto_update                     "yes"
auto_update_depth               "3"

# General options
bind_to_address                 "localhost"
bind_to_address                 "/tmp/mpd_socket.sock"
port                            "6600"

# Network & Buffer Tuning
max_output_buffer_size          "16384"
audio_buffer_size               "2048"
connection_timeout              "30"

# Input Configuration
input {
    plugin                      "curl"
}

# Decoders
decoder {
    plugin                      "ffmpeg"
    enabled                     "yes"
}

decoder {
    plugin                      "hybrid_dsd"
    enabled                     "no"
}

decoder {
    plugin                      "wildmidi"
    enabled                     "no"
}

# Audio Output
audio_output {
    type                        "fifo"
    name                        "my_fifo"
    path                        "/audio/output"
    format                      "44100:16:2"
}

# Character Encoding
filesystem_charset              "UTF-8"
